<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .pulse-circle {
        transform-origin: center;
        animation: pulse 4s ease-in-out infinite alternate;
      }
      .float-particle {
        animation: float 6s ease-in-out infinite alternate;
      }
      .glow-grid {
        stroke: #4f46e5;
        stroke-opacity: 0.15;
        stroke-width: 1;
      }
      @keyframes pulse {
        0% { transform: scale(0.95); opacity: 0.3; }
        100% { transform: scale(1.05); opacity: 0.7; }
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-15px); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Dynamic Background Grid -->
  <g class="glow-grid">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200" />
    <path d="M150 0 V360 M300 0 V360 M450 0 V360 M600 0 V360 M750 0 V360 M900 0 V360 M1050 0 V360" />
  </g>

  <!-- Dynamic Abstract Animated Elements (Background Layer) -->
  <g class="pulse-circle">
    <circle cx="150" cy="180" r="120" fill="#6366f1" opacity="0.15" filter="url(#glow)" />
    <circle cx="1050" cy="180" r="140" fill="#a855f7" opacity="0.15" filter="url(#glow)" />
  </g>
  <g class="float-particle">
    <circle cx="280" cy="80" r="6" fill="#38bdf8" opacity="0.6" />
    <circle cx="920" cy="280" r="8" fill="#c084fc" opacity="0.6" />
    <circle cx="100" cy="290" r="5" fill="#818cf8" opacity="0.5" />
    <circle cx="1100" cy="90" r="7" fill="#38bdf8" opacity="0.5" />
  </g>

  <!-- Foreground Content (Text & Icons) -->
  <g text-anchor="middle">
    <!-- Icon / Badge -->
    <rect x="540" y="45" width="120" height="36" rx="18" fill="#312e81" stroke="#6366f1" stroke-width="1.5" />
    <text x="600" y="68" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="14" letter-spacing="1">CURATED LIST</text>

    <!-- Main Title -->
    <text x="600" y="145" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="44" letter-spacing="-0.5" filter="url(#glow)">
      Awesome Applicant Assessment Platform
    </text>

    <!-- Subtitle -->
    <text x="600" y="195" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="20" opacity="0.95">
      Top SaaS Platforms &amp; Open-Source Projects for Skills Testing &amp; Pre-Employment Screening
    </text>

    <!-- Feature Tags -->
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">
      <!-- Tag 1 -->
      <rect x="290" y="240" width="170" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="375" y="261" fill="#94a3b8">🧠 Cognitive Testing</text>

      <!-- Tag 2 -->
      <rect x="475" y="240" width="160" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="555" y="261" fill="#94a3b8">💻 Coding Screening</text>

      <!-- Tag 3 -->
      <rect x="650" y="240" width="160" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="730" y="261" fill="#94a3b8">📊 Psychometrics</text>

      <!-- Tag 4 -->
      <rect x="825" y="240" width="170" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="910" y="261" fill="#94a3b8">⚡ Open Execution</text>
    </g>
  </g>
</svg>
